name: Scan CloudFormation Template

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Sustainability Scanner GitHub Action
        # You may pin to the exact commit or the version.
        # uses: aws-actions/sustainability-scanner@e9cc38a79df82ee4130722108aad2f87a2083fa2
        uses: aws-actions/sustainability-scanner@v1
